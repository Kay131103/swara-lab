name: Deploy to Vercel (Container)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-melomaster
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deployment (Container Runtime)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.vercel.com/v13/deployments?teamId=team_vuxupM63pq3ePJRjBxvlb43M&skipAutoDetectionConfirmation=1" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"melomaster","gitSource":{"type":"github","repoId":1437051614,"ref":"main"},"target":"production"}')
          ID=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id','') or d.get('error',{}).get('message',''))")
          echo "deployment: $ID"
